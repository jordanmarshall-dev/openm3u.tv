[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openm3u"
version = "1.0.0"
description = "Curates free, publicly available live TV streams into clean, cable-style playlists with a complete guide."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jordan Marshall" }]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://jordanmarshall-dev.github.io/openm3u.tv/"
Source = "https://github.com/jordanmarshall-dev/openm3u.tv"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
openm3u = "openm3u.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openm3u"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["openm3u"]
