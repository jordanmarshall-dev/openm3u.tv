# One lineup shape for every country.
#
# Each group gets its own hundred, the way cable does it. Labels are what the
# sources call their categories (Samsung's "News & Opinion", Pluto's "News + Opinion",
# iptv-org's "news") plus the categories guides put on programmes. They're compared
# loosely: case, accents, "&" versus "and" and punctuation don't matter.
#
# A region can rename or resize a group, or send a label somewhere else, in its own
# file. Everything else is shared.

fallback = "entertainment"
series = "series"

[[group]]
id = "local"
name = "Local"
start = 1
size = 99
live = true
sort = "place"
keep_small = true
labels = ["local", "free to air"]

[[group]]
id = "news"
name = "News"
start = 100
live = true
sort = "place"
labels = [
  "news", "news & opinion", "news + opinion", "local news", "news & information",
  "news/current affairs", "current affairs", "news magazine", "news & documentaries",
  "weather", "business", "legislative", "debate/interview",
  "social, political issues, economics",
]
hints = [
  "news", "cnn", "cna", "dw english", "al jazeera", "bloomberg", "parliament", "weather",
  "cpac", "newsnation", "livenow",
]

