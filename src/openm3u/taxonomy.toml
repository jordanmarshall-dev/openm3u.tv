# Channels that loop a single show. Nothing maps here by label: they're spotted
# from their schedule and shelved A to Z.
[[group]]
id = "series"
name = "Series"
start = 1100
size = 300
sort = "name"
keep_small = true

# Other languages get a block each, after everything else, when the region asks
# for one. These labels say a channel's language outright.
[languages]
es = ["en español", "latino", "latin"]
fr = ["kids en français", "en français"]

# Left out of every lineup. The key is the reason shown in the build report.
[skip]
shopping = ["shop", "shopping", "advertisement/shopping", "infomercial"]
religion = ["religious", "religion", "faith"]
adult = ["xxx", "adult"]
"public access" = ["public access"]
